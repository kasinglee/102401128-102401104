<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>拾见｜校园失物招领</title>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/core.js"></script>
  <script defer src="js/storage.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/pages/search.js"></script>
  <script defer src="js/pages/detail.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <div class="header-inner">
        <button class="brand" type="button" data-nav="home" aria-label="拾见，返回首页">
          <span class="brand-mark" aria-hidden="true">拾</span>
          <span class="brand-name">拾见<span class="brand-dot">.</span></span>
        </button>
        <nav class="site-nav" aria-label="主导航">
          <button type="button" class="nav-link" data-nav="home">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20H3v-8.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 20v-7h6v7" stroke="currentColor" stroke-width="1.8"/></svg>
            <span>首页</span>
          </button>
          <button type="button" class="nav-link nav-primary" data-nav="publish">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span>发布</span>
          </button>
          <button type="button" class="nav-link" data-nav="my-posts">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span>我的</span>
          </button>
        </nav>
      </div>
    </header>
    <main id="app" tabindex="-1"></main>
    <footer class="site-footer">
      <span>拾见 · 让失物回家的路更短</span>
      <span>演示信息与联系方式均为虚构数据</span>
    </footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
