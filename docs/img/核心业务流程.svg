<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">拾见校园失物招领核心业务流程</title>
  <desc id="desc">用户发布信息，通过校验后浏览或搜索、查看详情和联系方式，随后由发布者更新状态，状态同步到所有页面。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4fbf8"/><stop offset="1" stop-color="#edf7f3"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f5d57" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#47877f"/></marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #123b46; }
      .title { font-size: 29px; font-weight: 700; }.sub { font-size: 14px; fill: #55747a; }.label { font-size: 17px; font-weight: 700; }
      .step { fill: #fff; stroke: #b9ddd4; stroke-width: 2; filter: url(#shadow); }.action { fill: #e4f5ee; stroke: #0b8075; stroke-width: 2; filter: url(#shadow); }
      .decision { fill: #fffaf0; stroke: #e5ae4b; stroke-width: 2; filter: url(#shadow); }.result { fill: #0b8075; stroke: #0b8075; stroke-width: 2; filter: url(#shadow); }
      .flow { fill: none; stroke: #47877f; stroke-width: 2.5; marker-end: url(#arrow); }.warn { fill: none; stroke: #c98928; stroke-width: 2.5; marker-end: url(#arrow); }.note { font-size: 13px; fill: #8b6b31; }
    </style>
  </defs>
  <rect width="1200" height="790" fill="url(#bg)"/><rect x="36" y="28" width="1128" height="734" rx="28" fill="#fff" stroke="#d6ebe5" stroke-width="2"/>
  <text x="78" y="85" class="title">拾见｜校园失物招领核心业务流程</text><text x="78" y="116" class="sub">发布信息 → 浏览或搜索 → 查看详情与联系方式 → 更新状态</text><line x1="78" y1="142" x2="1122" y2="142" stroke="#d8ebe6" stroke-width="2"/>
  <rect class="action" x="82" y="189" width="195" height="88" rx="18"/><text x="180" y="224" text-anchor="middle" class="label">① 发布信息</text><text x="180" y="249" text-anchor="middle" class="sub">选择寻物或招领</text>
  <path class="flow" d="M277 233H347"/><rect class="step" x="347" y="189" width="214" height="88" rx="18"/><text x="454" y="224" text-anchor="middle" class="label">② 填写关键信息</text><text x="454" y="249" text-anchor="middle" class="sub">名称、地点、时间、联系</text>
  <path class="flow" d="M561 233H632"/><path class="decision" d="M727 171L818 233L727 295L636 233Z"/><text x="727" y="229" text-anchor="middle" class="label">校验通过？</text>
  <path class="warn" d="M727 295V350H455"/><text x="742" y="325" class="note">否</text><rect x="260" y="323" width="195" height="55" rx="15" fill="#fff4df" stroke="#e5ae4b" stroke-width="2"/><text x="357" y="357" text-anchor="middle" class="label" fill="#9a6516">提示并修正字段</text><path class="warn" d="M260 350H180V277"/>
  <path class="flow" d="M818 233H876"/><text x="843" y="219" class="sub">是</text><rect class="action" x="876" y="189" width="237" height="88" rx="18"/><text x="994" y="224" text-anchor="middle" class="label">③ 保存并发布</text><text x="994" y="249" text-anchor="middle" class="sub">自动发现相似线索</text>
  <path class="flow" d="M994 277V424H865"/><rect class="step" x="649" y="424" width="216" height="88" rx="18"/><text x="757" y="459" text-anchor="middle" class="label">④ 首页浏览或搜索</text><text x="757" y="484" text-anchor="middle" class="sub">关键词、类型、状态筛选</text>
  <path class="flow" d="M649 468H579"/><rect class="step" x="350" y="424" width="229" height="88" rx="18"/><text x="465" y="459" text-anchor="middle" class="label">⑤ 查看物品详情</text><text x="465" y="484" text-anchor="middle" class="sub">展开并复制联系方式</text>
  <path class="flow" d="M350 468H281"/><rect class="action" x="82" y="424" width="199" height="88" rx="18"/><text x="181" y="459" text-anchor="middle" class="label">⑥ 线下联系核对</text><text x="181" y="484" text-anchor="middle" class="sub">确认物品特征</text>
  <path class="flow" d="M181 512V607H288"/><rect class="step" x="288" y="563" width="238" height="88" rx="18"/><text x="407" y="598" text-anchor="middle" class="label">⑦ 我的发布更新状态</text><text x="407" y="623" text-anchor="middle" class="sub">已找到 / 已归还</text>
  <path class="flow" d="M526 607H597"/><rect class="result" x="597" y="563" width="278" height="88" rx="18"/><text x="736" y="598" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">⑧ 首页与详情同步</text><text x="736" y="623" text-anchor="middle" font-size="14" fill="#d9f4eb">结束记录仍可查看，减少重复联系</text>
  <text x="1080" y="713" text-anchor="end" class="sub">HW4 · 2026</text>
</svg>
