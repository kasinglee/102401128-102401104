<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1230" viewBox="0 0 1100 1230" role="img" aria-labelledby="title"><title id="title">完整业务流程：蓝色雨伞示例与失败处理</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#24897e" /></marker><marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#bc791c" /></marker><style>text{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#163c45}.heading{font-size:22px;font-weight:700}.body{font-size:18px;fill:#365e65}.code{font-size:17px;fill:#315d75}.flow{fill:none;stroke:#24897e;stroke-width:3;stroke-linejoin:round;marker-end:url(#arrow)}.error{fill:none;stroke:#bc791c;stroke-width:3;stroke-linejoin:round;marker-end:url(#error-arrow)}</style></defs>
<rect x="40" y="20" width="620" height="110" rx="16" fill="#eaf7f2" stroke="#68b5a9" stroke-width="2" />
<text x="350.0" y="54" class="heading" text-anchor="middle">1  点底部 / 顶部「发布」</text>
<text x="350.0" y="84" class="body" text-anchor="middle">选「我在寻物」或「我来招领」</text>
<text x="350.0" y="111" class="body" text-anchor="middle">例：选择「我在寻物」</text>
<path class="flow" d="M350 130V165" />
<rect x="40" y="165" width="620" height="120" rx="16" fill="#ffffff" stroke="#68b5a9" stroke-width="2" />
<text x="350.0" y="199" class="heading" text-anchor="middle">2  填表后点「确认发布」</text>
<text x="350.0" y="229" class="body" text-anchor="middle">蓝色折叠雨伞 · 东3-405 · 实际发生时间</text>
<text x="350.0" y="256" class="body" text-anchor="middle">填写 QQ 或校内账号；描述、图片可选</text>
<path class="flow" d="M350 285V325" />
<path d="M350 325L535 385L350 445L165 385Z" fill="#fff7e9" stroke="#cf9d4b" stroke-width="2" />
<text x="350" y="379" class="heading" text-anchor="middle">必填项、长度、时间</text>
<text x="350" y="408" class="body" text-anchor="middle">是否符合要求？</text>
<path class="error" d="M535 385H750" />
<rect x="595.0" y="353" width="54" height="28" rx="8" fill="#fff" />
<text x="622" y="372" class="body" text-anchor="middle">否</text>
<rect x="750" y="330" width="310" height="110" rx="16" fill="#fff7e9" stroke="#cf9d4b" stroke-width="2" />
<text x="905.0" y="364" class="heading" text-anchor="middle">标红并提示错误</text>
<text x="905.0" y="394" class="body" text-anchor="middle">例：「请填写地点」</text>
<text x="905.0" y="421" class="body" text-anchor="middle">保留已填内容，修改后重试</text>
<path class="error" d="M905 330V225H660" />
<path class="flow" d="M350 445V500" />
<rect x="352.0" y="460" width="54" height="28" rx="8" fill="#fff" />
<text x="379" y="479" class="body" text-anchor="middle">是</text>
<rect x="40" y="500" width="620" height="110" rx="16" fill="#eaf7f2" stroke="#68b5a9" stroke-width="2" />
<text x="350.0" y="534" class="heading" text-anchor="middle">3  保存记录 → 成功后进入「我的发布」</text>
<text x="350.0" y="564" class="body" text-anchor="middle">新增记录显示「寻找中」或「招领中」</text>
<text x="350.0" y="591" class="body" text-anchor="middle">自动列出可能相关的另一类型线索</text>
<path class="error" d="M660 555H750" />
<rect x="654.0" y="522" width="94" height="28" rx="8" fill="#fff" />
<text x="701" y="541" class="body" text-anchor="middle">保存失败</text>
<rect x="750" y="500" width="310" height="110" rx="16" fill="#fff7e9" stroke="#cf9d4b" stroke-width="2" />
<text x="905.0" y="534" class="heading" text-anchor="middle">提示「浏览器无法保存」</text>
<text x="905.0" y="564" class="body" text-anchor="middle">停留在发布页，保留表单</text>
<text x="905.0" y="591" class="body" text-anchor="middle">检查存储空间或权限后重试</text>
<path class="flow" d="M350 610V650" />
<rect x="40" y="650" width="620" height="110" rx="16" fill="#ffffff" stroke="#68b5a9" stroke-width="2" />
<text x="350.0" y="684" class="heading" text-anchor="middle">4  点「首页」浏览，或输入「东三 雨伞」</text>
<text x="350.0" y="714" class="body" text-anchor="middle">搜索直接筛选首页卡片；可叠加类型、状态</text>
<text x="350.0" y="741" class="body" text-anchor="middle">无结果时修改关键词；清空后恢复列表</text>
<path class="flow" d="M350 760V800" />
<rect x="40" y="800" width="620" height="110" rx="16" fill="#ffffff" stroke="#68b5a9" stroke-width="2" />
<text x="350.0" y="834" class="heading" text-anchor="middle">5  点雨伞卡片 → 查看详情 → 复制联系方式</text>
<text x="350.0" y="864" class="body" text-anchor="middle">通过 QQ 等方式联系发布者，核对物品特征</text>
<text x="350.0" y="891" class="body" text-anchor="middle">详情点返回，保留首页原来的筛选条件</text>
<path class="flow" d="M350 910V950" />
<rect x="40" y="950" width="620" height="100" rx="16" fill="#ffffff" stroke="#68b5a9" stroke-width="2" />
<text x="350.0" y="984" class="heading" text-anchor="middle">6  取回 / 归还后，发布者点「我的」</text>
<path class="flow" d="M350 1050V1080H195V1110" />
<path class="flow" d="M350 1080H510V1110" />
<rect x="40" y="1110" width="310" height="90" rx="16" fill="#eaf7f2" stroke="#68b5a9" stroke-width="2" />
<text x="195.0" y="1144" class="heading" text-anchor="middle">寻物：点「标记已找到」</text>
<rect x="390" y="1110" width="310" height="90" rx="16" fill="#eaf7f2" stroke="#68b5a9" stroke-width="2" />
<text x="545.0" y="1144" class="heading" text-anchor="middle">招领：点「标记已归还」</text>
<rect x="750" y="1025" width="310" height="120" rx="16" fill="#eaf7f2" stroke="#68b5a9" stroke-width="2" />
<text x="905.0" y="1059" class="heading" text-anchor="middle">7  保存新状态并刷新页面</text>
<text x="905.0" y="1089" class="body" text-anchor="middle">首页、详情显示结束状态</text>
<text x="905.0" y="1116" class="body" text-anchor="middle">开启「只看进行中」后隐藏</text>
<text x="905.0" y="1143" class="body" text-anchor="middle">「我的」仍可查看结束记录</text>
<path class="flow" d="M700 1155H725V1085H750" />
<path d="M195 1200V1215H725V1155" fill="none" stroke="#24897e" stroke-width="3" />
<text x="350" y="1014" class="body" text-anchor="middle">找到自己发布的卡片，点对应的结束按钮</text>
<text x="195" y="1174" class="body" text-anchor="middle">寻找中 → 已找到</text>
<text x="545" y="1174" class="body" text-anchor="middle">招领中 → 已归还</text>
</svg>
