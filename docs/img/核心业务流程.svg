<svg xmlns="http://www.w3.org/2000/svg" width="660" height="680" viewBox="0 0 660 680" role="img" aria-labelledby="title"><title id="title">核心业务流程</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#555"/></marker><style>text{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:20px;fill:#222;text-anchor:middle}.node{fill:#fff;stroke:#555;stroke-width:1.5}.flow{fill:none;stroke:#555;stroke-width:1.8;marker-end:url(#arrow);stroke-linejoin:round}.small{font-size:16px}</style></defs>
