<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc">
  <title id="title">拾见校园失物招领核心业务流程</title>
  <desc id="desc">发布信息通过校验后进入首页，用户查看详情并联系核对，发布者最终更新状态。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f5d57" flood-opacity=".13"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#438a81"/></marker>
    <marker id="warn-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c88625"/></marker>
    <style>
      text { font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif; fill:#123b46 }
      .node { fill:#fff; stroke:#b9ddd4; stroke-width:2; filter:url(#shadow) }
      .main { fill:#e3f5ee; stroke:#0b8075 }
      .end { fill:#0b8075; stroke:#0b8075 }
      .decision { fill:#fffaf0; stroke:#e7a836; stroke-width:2; filter:url(#shadow) }
      .label { font-size:17px; font-weight:700 }
      .sub { font-size:13px; fill:#5d797e }
      .flow { fill:none; stroke:#438a81; stroke-width:2.5; marker-end:url(#arrow) }
      .warn { fill:none; stroke:#c88625; stroke-width:2.5; marker-end:url(#warn-arrow) }
      .hint { font-size:13px; fill:#866324 }
    </style>
  </defs>
  <rect class="node main" x="25" y="40" width="190" height="84" rx="18"/>
  <text x="120" y="75" text-anchor="middle" class="label">① 发布信息</text>
  <text x="120" y="101" text-anchor="middle" class="sub">选择寻物或招领</text>
  <path class="flow" d="M215 82H270"/>
  <rect class="node" x="270" y="40" width="200" height="84" rx="18"/>
  <text x="370" y="75" text-anchor="middle" class="label">② 填写关键信息</text>
  <text x="370" y="101" text-anchor="middle" class="sub">名称、地点、时间、联系</text>
  <path class="flow" d="M470 82H520"/>
  <path class="decision" d="M610 18 700 82 610 146 520 82Z"/>
  <text x="610" y="78" text-anchor="middle" class="label">校验通过？</text>
  <path class="flow" d="M700 82H755"/>
  <text x="726" y="67" text-anchor="middle" class="sub">是</text>
  <rect class="node main" x="755" y="40" width="210" height="84" rx="18"/>
  <text x="860" y="75" text-anchor="middle" class="label">③ 保存并发布</text>
  <text x="860" y="101" text-anchor="middle" class="sub">自动发现相似线索</text>
  <path class="warn" d="M610 146V179"/>
  <text x="625" y="166" class="hint">否</text>
  <rect x="480" y="179" width="205" height="52" rx="15" fill="#fff4df" stroke="#e7a836" stroke-width="2"/>
  <text x="582" y="211" text-anchor="middle" class="label" fill="#8b611b">提示并修正字段</text>
  <path class="warn" d="M480 205H370V124"/>

  <path class="flow" d="M860 124V282H820"/>
  <rect class="node" x="620" y="240" width="200" height="84" rx="18"/>
  <text x="720" y="275" text-anchor="middle" class="label">④ 首页浏览或搜索</text>
  <text x="720" y="301" text-anchor="middle" class="sub">关键词、类型、状态筛选</text>
  <path class="flow" d="M620 282H565"/>
  <rect class="node" x="365" y="240" width="200" height="84" rx="18"/>
  <text x="465" y="275" text-anchor="middle" class="label">⑤ 查看物品详情</text>
  <text x="465" y="301" text-anchor="middle" class="sub">展开并复制联系方式</text>
  <path class="flow" d="M365 282H310"/>
  <rect class="node main" x="110" y="240" width="200" height="84" rx="18"/>
  <text x="210" y="275" text-anchor="middle" class="label">⑥ 线下联系核对</text>
  <text x="210" y="301" text-anchor="middle" class="sub">确认物品特征</text>

  <path class="flow" d="M210 324V422H330"/>
  <rect class="node" x="330" y="380" width="220" height="84" rx="18"/>
  <text x="440" y="415" text-anchor="middle" class="label">⑦ 我的发布更新状态</text>
  <text x="440" y="441" text-anchor="middle" class="sub">已找到 / 已归还</text>
  <path class="flow" d="M550 422H610"/>
  <rect class="node end" x="610" y="380" width="260" height="84" rx="18"/>
  <text x="740" y="415" text-anchor="middle" class="label" fill="#fff">⑧ 首页与详情同步</text>
  <text x="740" y="441" text-anchor="middle" font-size="13" fill="#d9f4eb">结束记录仍保留并降低优先级</text>
</svg>
