<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
  <title id="title">拾见关键数据流</title>
  <desc id="desc">页面事件进入 app.js，分别调用 core.js 规则和 storage.js 存储，storage.js 与 localStorage 双向交换数据，结果再返回页面。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f5d57" flood-opacity=".13"/></filter>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#438a81"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#537da7"/></marker>
    <style>
      text { font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif; fill:#123b46 }
      .node { fill:#fff; stroke:#b9ddd4; stroke-width:2; filter:url(#shadow) }
      .logic { fill:#e3f5ee; stroke:#0b8075 }
      .store { fill:#e8f0fb; stroke:#537da7 }
      .disk { fill:#fffaf0; stroke:#d8a94b }
      .label { font-size:18px; font-weight:700 }
      .sub { font-size:13px; fill:#5d797e }
      .green { fill:none; stroke:#438a81; stroke-width:2.5; marker-end:url(#arrow-green) }
      .blue { fill:none; stroke:#537da7; stroke-width:2.5; marker-end:url(#arrow-blue) }
      .caption { font-size:12px; fill:#55747a }
    </style>
  </defs>

  <rect class="node" x="25" y="45" width="180" height="76" rx="17"/>
  <text x="115" y="77" text-anchor="middle" class="label">首页</text>
  <text x="115" y="101" text-anchor="middle" class="sub">浏览、搜索、筛选</text>
  <rect class="node" x="25" y="197" width="180" height="76" rx="17"/>
  <text x="115" y="229" text-anchor="middle" class="label">发布页</text>
  <text x="115" y="253" text-anchor="middle" class="sub">收集并校验草稿</text>
  <rect class="node" x="25" y="349" width="180" height="76" rx="17"/>
  <text x="115" y="381" text-anchor="middle" class="label">详情 / 我的发布</text>
  <text x="115" y="405" text-anchor="middle" class="sub">联系、状态维护</text>

  <path class="green" d="M205 83H270V205H325"/>
  <path class="green" d="M205 235H325"/>
  <path class="green" d="M205 387H270V265H325"/>
  <text x="246" y="69" class="caption">查询条件</text>
  <text x="235" y="221" class="caption">发布草稿</text>
  <text x="218" y="372" class="caption">详情 / 状态操作</text>

  <rect class="node logic" x="325" y="170" width="190" height="130" rx="20"/>
  <text x="420" y="207" text-anchor="middle" class="label">app.js</text>
  <text x="420" y="233" text-anchor="middle" class="sub">页面导航与事件绑定</text>
  <text x="420" y="257" text-anchor="middle" class="sub">调用规则和存储接口</text>
  <text x="420" y="281" text-anchor="middle" class="sub">用返回结果更新页面</text>

  <rect class="node logic" x="655" y="45" width="180" height="108" rx="20"/>
  <text x="745" y="82" text-anchor="middle" class="label">core.js</text>
  <text x="745" y="108" text-anchor="middle" class="sub">校验、搜索、状态</text>
  <text x="745" y="132" text-anchor="middle" class="sub">相似线索规则</text>
  <path class="green" d="M515 205H585V99H655"/>
  <text x="535" y="187" class="caption">调用规则</text>
  <path class="green" d="M655 126H610V174H515"/>
  <text x="548" y="151" class="caption">返回结果</text>

  <rect class="node store" x="655" y="317" width="180" height="108" rx="20"/>
  <text x="745" y="354" text-anchor="middle" class="label">storage.js</text>
  <text x="745" y="380" text-anchor="middle" class="sub">统一 Store 接口</text>
  <text x="745" y="404" text-anchor="middle" class="sub">发布、读取、结束</text>
  <path class="blue" d="M515 265H585V371H655"/>
  <text x="535" y="287" class="caption">读写数据</text>
  <path class="blue" d="M655 344H610V296H515"/>
  <text x="548" y="328" class="caption">返回记录</text>

  <rect class="node disk" x="920" y="317" width="155" height="108" rx="20"/>
  <text x="997" y="354" text-anchor="middle" class="label">localStorage</text>
  <text x="997" y="380" text-anchor="middle" class="sub">当前浏览器</text>
  <text x="997" y="404" text-anchor="middle" class="sub">持久化数据</text>
  <path class="blue" d="M835 352H920"/>
  <text x="870" y="338" class="caption">保存</text>
  <path class="blue" d="M920 397H835"/>
  <text x="870" y="421" class="caption">加载</text>
</svg>
