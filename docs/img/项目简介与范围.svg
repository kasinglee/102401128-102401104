<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="740" viewBox="0 0 1080 740" role="img" aria-labelledby="title"><title id="title">项目范围：发布、搜索、联系和结束信息</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#24897e"/></marker><marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#bc791c"/></marker><style>text{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#163c45}.heading{font-size:22px;font-weight:700}.body{font-size:18px;fill:#365e65}.code{font-size:17px;fill:#315d75}.flow{fill:none;stroke:#24897e;stroke-width:3;stroke-linejoin:round;marker-end:url(#arrow)}.error{fill:none;stroke:#bc791c;stroke-width:3;stroke-linejoin:round;marker-end:url(#error-arrow)}</style></defs>
<rect x="40" y="20" width="460" height="120" rx="16" fill="#eaf7f2" stroke="#68b5a9" stroke-width="2"/>
<text x="270.0" y="54" class="heading" text-anchor="middle">丢了物品 → 发布「寻物」</text>
<text x="270.0" y="84" class="body" text-anchor="middle">例：蓝色折叠雨伞，东3-405</text>
<text x="270.0" y="111" class="body" text-anchor="middle">填写发生时间和联系方式</text>
<rect x="580" y="20" width="460" height="120" rx="16" fill="#eaf7f2" stroke="#68b5a9" stroke-width="2"/>
<text x="810.0" y="54" class="heading" text-anchor="middle">捡到物品 → 发布「招领」</text>
<text x="810.0" y="84" class="body" text-anchor="middle">填写物品名称、拾取地点和时间</text>
<text x="810.0" y="111" class="body" text-anchor="middle">留下联系方式，保留特征供认领核对</text>
<path d="M270 140V170H540" fill="none" stroke="#24897e" stroke-width="3"/>
<path d="M810 140V170H540" fill="none" stroke="#24897e" stroke-width="3"/><path class="flow" d="M540 170V200"/>
<rect x="170" y="200" width="740" height="110" rx="16" fill="#ffffff" stroke="#68b5a9" stroke-width="2"/>
<text x="540.0" y="234" class="heading" text-anchor="middle">首页：把寻物和招领放在同一个列表</text>
<text x="540.0" y="264" class="body" text-anchor="middle">输入「东三 雨伞」可匹配「东3」和「雨伞」</text>
<text x="540.0" y="291" class="body" text-anchor="middle">可以同时选「寻物 / 招领」和「只看进行中」</text>
<path class="flow" d="M540 310V350"/>
<rect x="170" y="350" width="740" height="110" rx="16" fill="#ffffff" stroke="#68b5a9" stroke-width="2"/>
<text x="540.0" y="384" class="heading" text-anchor="middle">点物品卡片 → 详情 → 复制联系方式</text>
<text x="540.0" y="414" class="body" text-anchor="middle">查看描述、图片和地点，再联系发布者核对</text>
<text x="540.0" y="441" class="body" text-anchor="middle">通过 QQ 等外部方式沟通、取回或归还物品</text>
<path class="flow" d="M540 460V500"/>
<rect x="170" y="500" width="740" height="110" rx="16" fill="#eaf7f2" stroke="#68b5a9" stroke-width="2"/>
<text x="540.0" y="534" class="heading" text-anchor="middle">发布者回到「我的」结束自己的记录</text>
<text x="540.0" y="564" class="body" text-anchor="middle">寻物点「标记已找到」；招领点「标记已归还」</text>
<text x="540.0" y="591" class="body" text-anchor="middle">首页和详情显示新状态，记录仍然保留</text>
<rect x="170" y="650" width="740" height="70" rx="16" fill="#fff7e9" stroke="#cf9d4b" stroke-width="2"/>
<text x="540.0" y="684" class="heading" text-anchor="middle">数据只保存在当前浏览器，换设备不会同步</text>
</svg>
