<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-labelledby="title desc">
  <title id="title">拾见项目简介与范围流程</title>
  <desc id="desc">将群聊中分散的失物招领线索，通过发布、搜索、详情联系和状态维护形成完整闭环。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f5d57" flood-opacity=".13"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#438a81"/></marker>
    <style>
      text { font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif; fill:#123b46 }
      .node { fill:#fff; stroke:#b9ddd4; stroke-width:2; filter:url(#shadow) }
      .main { fill:#e3f5ee; stroke:#0b8075 }
      .label { font-size:18px; font-weight:700 }
      .sub { font-size:14px; fill:#5d797e }
      .flow { fill:none; stroke:#438a81; stroke-width:2.5; marker-end:url(#arrow) }
      .scope { font-size:14px; fill:#7b6a59 }
    </style>
  </defs>
  <rect class="node" x="25" y="78" width="170" height="92" rx="18"/>
  <text x="110" y="116" text-anchor="middle" class="label">分散的校园线索</text>
  <text x="110" y="144" text-anchor="middle" class="sub">群聊消息容易被覆盖</text>
  <path class="flow" d="M195 124H235"/>
  <rect class="node main" x="235" y="78" width="170" height="92" rx="18"/>
  <text x="320" y="116" text-anchor="middle" class="label">发布信息</text>
  <text x="320" y="144" text-anchor="middle" class="sub">寻物 / 招领</text>
  <path class="flow" d="M405 124H445"/>
  <rect class="node" x="445" y="78" width="190" height="92" rx="18"/>
  <text x="540" y="116" text-anchor="middle" class="label">集中浏览与搜索</text>
  <text x="540" y="144" text-anchor="middle" class="sub">关键词、类型、状态筛选</text>
  <path class="flow" d="M635 124H675"/>
  <rect class="node" x="675" y="78" width="170" height="92" rx="18"/>
  <text x="760" y="116" text-anchor="middle" class="label">详情与联系</text>
  <text x="760" y="144" text-anchor="middle" class="sub">查看并核对物品</text>
  <path class="flow" d="M845 124H885"/>
  <rect class="node main" x="885" y="78" width="190" height="92" rx="18"/>
  <text x="980" y="116" text-anchor="middle" class="label">发布者更新状态</text>
  <text x="980" y="144" text-anchor="middle" class="sub">已找到 / 已归还</text>
  <path class="flow" d="M980 170V214H110V170"/>
  <text x="545" y="237" text-anchor="middle" class="sub">结束信息仍可查看，减少重复询问，形成信息闭环</text>
  <line x1="80" y1="276" x2="1020" y2="276" stroke="#d8e8e3" stroke-width="1.5"/>
  <text x="550" y="306" text-anchor="middle" class="scope">范围边界：不实现复杂后台、实名认证、即时聊天和地图定位；数据保存在当前浏览器</text>
</svg>
