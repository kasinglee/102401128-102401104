<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">拾见项目定位与实现范围</title>
  <desc id="desc">校园失物招领网页围绕发布、搜索、详情、联系方式和状态维护实现核心流程，并明确不实现后台、实名、聊天和地图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4fbf8"/><stop offset="1" stop-color="#edf7f3"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f5d57" flood-opacity=".12"/></filter>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #123b46; }
      .title { font-size: 29px; font-weight: 700; }
      .sub { font-size: 15px; fill: #5c777d; }
      .card { fill: #fff; stroke: #c7e3db; stroke-width: 2; filter: url(#shadow); }
      .core { fill: #e3f5ee; stroke: #0b8075; stroke-width: 2; filter: url(#shadow); }
      .exclude { fill: #fbf7f0; stroke: #d6baa1; stroke-width: 2; }
      .name { font-size: 18px; font-weight: 700; }
      .detail { font-size: 14px; fill: #5c777d; }
      .tag { font-size: 13px; font-weight: 700; fill: #0b8075; }
      .line { stroke: #67a79d; stroke-width: 2.5; fill: none; }
    </style>
  </defs>
  <rect width="1200" height="620" fill="url(#bg)"/>
  <rect x="35" y="28" width="1130" height="564" rx="28" fill="#fff" stroke="#d8ebe6" stroke-width="2"/>
  <text x="78" y="85" class="title">拾见｜项目简介与实现范围</text>
  <text x="78" y="115" class="sub">将校园群聊中分散的失物招领线索集中起来，优先实现信息闭环。</text>
  <line x1="78" y1="143" x2="1122" y2="143" stroke="#d8ebe6" stroke-width="2"/>

  <rect x="410" y="188" width="380" height="116" rx="22" class="core"/>
  <text x="600" y="230" text-anchor="middle" font-size="25" font-weight="700">拾见 · 校园失物招领</text>
  <text x="600" y="263" text-anchor="middle" class="sub">静态网页 · Chrome 直接打开 · 浏览器本地保存</text>
  <text x="600" y="286" text-anchor="middle" class="tag">核心目标：让每条线索可发布、可找到、可结束</text>

  <path class="line" d="M470 304 L250 374 M545 304 L470 374 M655 304 L730 374 M730 304 L950 374"/>
  <rect x="110" y="374" width="205" height="110" rx="18" class="card"/>
  <text x="212" y="414" text-anchor="middle" class="name">发布信息</text>
  <text x="212" y="442" text-anchor="middle" class="detail">寻物 / 招领</text>
  <text x="212" y="465" text-anchor="middle" class="detail">名称、地点、时间、联系</text>

  <rect x="365" y="374" width="205" height="110" rx="18" class="card"/>
  <text x="467" y="414" text-anchor="middle" class="name">浏览与搜索</text>
  <text x="467" y="442" text-anchor="middle" class="detail">关键词、类型筛选</text>
  <text x="467" y="465" text-anchor="middle" class="detail">只看进行中</text>

  <rect x="620" y="374" width="205" height="110" rx="18" class="card"/>
  <text x="722" y="414" text-anchor="middle" class="name">详情与联系</text>
  <text x="722" y="442" text-anchor="middle" class="detail">查看物品详情</text>
  <text x="722" y="465" text-anchor="middle" class="detail">折叠联系方式与复制</text>

  <rect x="875" y="374" width="205" height="110" rx="18" class="card"/>
  <text x="977" y="414" text-anchor="middle" class="name">状态维护</text>
  <text x="977" y="442" text-anchor="middle" class="detail">已找到 / 已归还</text>
  <text x="977" y="465" text-anchor="middle" class="detail">列表、详情同步</text>

  <text x="78" y="538" class="sub">本次不实现：</text>
  <rect x="180" y="512" width="126" height="42" rx="14" class="exclude"/><text x="243" y="539" text-anchor="middle" class="detail">复杂后台管理</text>
  <rect x="322" y="512" width="112" height="42" rx="14" class="exclude"/><text x="378" y="539" text-anchor="middle" class="detail">实名认证</text>
  <rect x="450" y="512" width="112" height="42" rx="14" class="exclude"/><text x="506" y="539" text-anchor="middle" class="detail">即时聊天</text>
  <rect x="578" y="512" width="112" height="42" rx="14" class="exclude"/><text x="634" y="539" text-anchor="middle" class="detail">地图定位</text>
  <text x="1122" y="539" text-anchor="end" class="sub">HW4 · 2026</text>
</svg>
